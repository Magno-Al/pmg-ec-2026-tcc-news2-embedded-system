# 0x82000 = BRCMF_FEAT_FWSUP (bit 13) | BRCMF_FEAT_SAE (bit 19).
# Com FWSUP o firmware 7.45.241 do BCM43455 faz o 4-way handshake sozinho e,
# quando falha, so ha timeout: wpa_supplicant fica em ASSOCIATED e desconecta
# com reason=3 locally_generated. Desligado, o wpa_supplicant faz o handshake
# e erros como senha errada aparecem no log.
options brcmfmac feature_disable=0x82000
